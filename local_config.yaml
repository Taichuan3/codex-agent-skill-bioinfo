package:
  name: codex-agent-skill-bioinfo
  version: 2.0-codex-multidevice-rc4
  release_status: candidate_only_provenance_reconstructed_stable_review_required
  scope: generic_bioinformatics_research
  runtime_scope: user_global
  default_language: zh-CN
  description: >
    通用生信科研 Codex agent package，面向 Home/Lab standalone OpenAI Codex CLI/IDE/app，
    用于研究规划、项目状态维护、数据分析、图表、论文写作、审稿风险、source data、
    ML benchmark、目录索引和复现检查。

entrypoints:
  root_agent: AGENTS.md
  skills_dir: .codex/skills
  codex_cli_skills_dir: .agents/skills
  custom_agents_dir: .codex/agents
  global_guidance_template: templates/global-AGENTS.md
  config_example: .codex/config.toml.example
  installer: scripts/install_codex_bioinfo.py
  validator: scripts/validate_package.py
  release_safety_fixtures: scripts/test_release_safety.py
  license: LICENSE
  notice: NOTICE.md
  third_party_notices: THIRD_PARTY_NOTICES.md
  external_provenance: docs/EXTERNAL_SOURCE_PROVENANCE.md
  external_file_lineage: docs/EXTERNAL_FILE_LINEAGE.tsv
  external_expression_review: docs/EXTERNAL_EXPRESSION_REVIEW_2026-07-25.tsv
  project_guide_file: PROJECT_GUIDE.md
  project_log_file: PROJECT_PLAN.md
  project_agent_policy: "运行时只保留全局 ~/.codex/AGENTS.md 与具体项目根 AGENTS.md 两层；项目容器父目录不放指导或状态文件。"

context_policy:
  read_by_default:
    - AGENTS.md
    - triggered_skill/SKILL.md
    - PROJECT_GUIDE.md summary/background/core_question/results_skeleton/current_progress
    - project_root/AGENTS.md when inside a concrete project
    - user_specified_files
  read_only_when_needed:
    - PROJECT_PLAN.md
    - long_manuscript_drafts
    - large_result_tables
    - historical_operation_logs
  notes:
    - Runtime guidance has two layers only: global host guidance and concrete project guidance.
    - Parent directories used only to store multiple projects must not add AGENTS.md, PROJECT_GUIDE.md, or PROJECT_PLAN.md.
    - PROJECT_GUIDE.md is hot project context.
    - PROJECT_PLAN.md is a cold append-only audit log and is not read by default.
    - Directory Card README.md files are read on demand before scanning heavy artifact directories.
    - Keep root AGENTS.md focused; task details belong in skills and project-specific rules belong in project AGENTS.md.

skills:
  - bioinfo-analysis-code
  - chinese-scientific-polishing
  - citation-verifier
  - claim-evidence-audit
  - clinical-bioinformatics-evidence
  - controlled-self-improvement
  - drug-discovery-admet-screening
  - environment-and-tool-adoption
  - evidence-gap-finder
  - figure-caption
  - literature-search-workflow
  - manuscript-consistency-audit
  - ml-benchmarking
  - paper-reader
  - pathway-network-analysis
  - project-directory-card-maintenance
  - project-environment-bootstrap
  - project-guide-maintainer
  - project-state-maintenance
  - protein-structure-docking
  - publication-plotting
  - research-data-organization
  - research-decision-review
  - research-project-planner
  - research-question-brief
  - reviewer-response-builder
  - reviewer-simulation
  - rnaseq-singlecell-workflow
  - scientific-database-grounding
  - scientific-english-polishing
  - scientific-english-translation
  - skill-quality-audit
  - source-data-audit
  - submission-readiness-audit
  - task-self-check
  - validation-strategy-planner
  - variant-genomics-interpretation

custom_agents:
  - capability_curator
  - bioinfo_source_mapper
  - bioinfo_implementation_worker
  - bioinfo_reproducibility_reviewer
  - bioinfo_claim_evidence_reviewer
  - bioinfo_release_reviewer

skill_metadata:
  required_files:
    - SKILL.md
    - agents/openai.yaml
    - evals/trigger-evals.json
    - evals/outcome-evals.json
  optional_dirs:
    - references
    - scripts
    - assets
  codex_cli_discovery:
    repo_scope: .agents/skills
    user_global_runtime: ~/.agents/skills
    source_layout: .codex/skills
    note: ~/.agents/skills is the single user-global portable Skill source; stale user Skills under ~/.codex/skills are backed up and retired while .system is preserved.
  trigger_source: SKILL.md frontmatter description

evidence_levels:
  - Strong
  - Moderate
  - Exploratory
  - Speculative

hard_constraints:
  - raw_data_is_read_only
  - do_not_upgrade_claims_without_evidence
  - do_not_silently_change_filters_versions_or_environment
  - project_level_AGENTS_files_are_preserved_for_project_logic
  - derived_wrong_outputs_may_be_overwritten_after_correction
  - manifest_or_source_data_inventory_must_point_to_current_valid_outputs
  - external_tools_require_source_version_license_and_adaptation_notes
  - parent_project_container_has_no_agent_or_project_state_files
  - project_agents_declare_data_results_figures_source_data_manifest_and_environment

validation:
  expected_skill_count: 37
  expected_root_agents: 1
  expected_custom_agent_count: 6
  eval_scope: static_schema_balance_and_route_ownership_only
  behavioral_eval_policy: representative_forward_tests_must_be_reported_separately
  required_absent_checks:
    - secrets_or_tokens
    - raw_data_files
    - runtime_cache_files
    - project_specific_result_tables
    - stale_project_specific_references
    - machine_profiles_or_absolute_private_paths

branch_integration:
  stable: main
  candidate_prefix: agent/
  legacy_input_branches:
    - Hermes-review
    - home_PC_codex
    - lab_PC_codex
  policy: >
    Collect candidates on short-lived branches; absorb mature Home/Lab/runtime mechanisms
    with keep/merge/split/project-only/local-only/reject review; open a draft PR;
    never merge or update main without explicit user approval.

sync_scope:
  include:
    - portable_bioinformatics_agents
    - portable_bioinformatics_skills
    - public_safe_references_and_scripts
    - install_and_validation_metadata
  project_private:
    - project_AGENTS
    - project_specific_skills
    - PROJECT_GUIDE
    - unpublished_results_and_claims
  exclude:
    - finance_and_investment
    - travel_and_personal_ledgers
    - native_codex_memory_sessions_and_cache
    - credentials_and_SSH_configuration
    - machine_paths_and_environment_records
    - raw_data_and_large_results
